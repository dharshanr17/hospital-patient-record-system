<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global City Hospital | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

    <div class="login-container">
        <div class="login-glass-card text-center">
            
            <div class="d-inline-flex align-items-center justify-content-center mb-3" 
                 style="width: 58px; height: 58px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 16px; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);">
                <i class="bi bi-hospital text-white fs-2"></i>
            </div>

            <h3 class="brand-font text-white mb-1">Global City Hospital</h3>
            <p class="text-white-50 small mb-4">Patient Record System & Cloud Healthcare Platform</p>

            <div id="login-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>

            <form id="login-form" class="text-start">
                <div class="mb-3">
                    <label class="form-label text-white-50 small">Username / Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control bg-transparent text-white border-secondary" placeholder="e.g. doctor@hprs.com" value="admin@hprs.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-white-50 small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control bg-transparent text-white border-secondary" placeholder="••••••••" value="Password123!" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2.5">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Platform
                </button>
            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cloud-storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
