<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPRS | Hospital Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .preset-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            color: rgba(255,255,255,0.85);
            font-size: 0.75rem;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            width: 100%;
        }
        .preset-btn:hover {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.4);
            color: #fff;
        }
        .preset-btn .role-badge {
            display: inline-block;
            font-size: 0.65rem;
            padding: 1px 6px;
            border-radius: 20px;
            margin-left: 4px;
            font-weight: 600;
        }
        .badge-admin   { background: rgba(234, 179, 8,  0.25); color: #fde68a; }
        .badge-doctor  { background: rgba(59,  130, 246, 0.25); color: #93c5fd; }
        .badge-recept  { background: rgba(16,  185, 129, 0.25); color: #6ee7b7; }
        .badge-nurse   { background: rgba(168, 85,  247, 0.25); color: #d8b4fe; }
        .sync-badge {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .sync-badge.live   { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.35); }
        .sync-badge.local  { background: rgba(245,158,11,0.2); color: #fcd34d; border: 1px solid rgba(245,158,11,0.35); }
        .sync-badge.check  { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }
        .preset-section-label {
            font-size: 0.68rem;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
    </style>
</head>
<body data-page="login">

    <div class="login-container">
        <div class="login-glass-card text-center">

            <!-- Logo -->
            <div class="d-inline-flex align-items-center justify-content-center mb-3"
                 style="width: 58px; height: 58px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 16px; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);">
                <i class="bi bi-hospital text-white fs-2"></i>
            </div>

            <h3 class="brand-font text-white mb-1">HPRS Network</h3>
            <p class="text-white-50 small mb-2">Patient Record System &amp; Cross-Hospital Cloud Sync</p>

            <!-- Cloud Sync Status Badge -->
            <div class="mb-3">
                <span id="sync-status-badge" class="sync-badge check">
                    <i class="bi bi-arrow-repeat"></i> Checking cloud…
                </span>
            </div>

            <div id="login-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>

            <!-- Quick-Select Presets -->
            <div class="mb-3 text-start">
                <div class="preset-section-label"><i class="bi bi-building me-1"></i>Hospital 1 — Global City Hospital</div>
                <div class="row g-1 mb-2">
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('admin@hprs.com')">
                            <i class="bi bi-shield-check me-1"></i>Admin
                            <span class="role-badge badge-admin">ADMIN</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('doctor@hprs.com')">
                            <i class="bi bi-person-badge me-1"></i>Doctor
                            <span class="role-badge badge-doctor">DR</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('receptionist@hprs.com')">
                            <i class="bi bi-person-workspace me-1"></i>Reception
                            <span class="role-badge badge-recept">REC</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('nurse@hprs.com')">
                            <i class="bi bi-heart-pulse me-1"></i>Nurse
                            <span class="role-badge badge-nurse">RN</span>
                        </button>
                    </div>
                </div>

                <div class="preset-section-label"><i class="bi bi-building me-1"></i>Hospital 2 — Metro Multi-Specialty</div>
                <div class="row g-1">
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('metro.admin@hprs.com')">
                            <i class="bi bi-shield-check me-1"></i>Admin
                            <span class="role-badge badge-admin">ADMIN</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('dr.rivera@hprs.com')">
                            <i class="bi bi-person-badge me-1"></i>Doctor
                            <span class="role-badge badge-doctor">DR</span>
                        </button>
                    </div>
                </div>
            </div>

            <hr style="border-color: rgba(255,255,255,0.12); margin: 0 0 16px 0;">

            <!-- Login Form -->
            <form id="login-form" class="text-start">
                <div class="mb-3">
                    <label class="form-label text-white-50 small">Username / Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control bg-transparent text-white border-secondary" placeholder="e.g. doctor@hprs.com" value="admin@hprs.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-white-50 small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control bg-transparent text-white border-secondary" placeholder="••••••••" value="Password123!" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2.5">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Platform
                </button>
            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Firebase Compat SDK (required for cross-device sync) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/cloud-storage.js"></script>
    <script src="js/firebase-sync.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Fill login form with preset credentials
        function setPreset(email) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = 'Password123!';
            document.getElementById('email').focus();
        }

        // Show cloud sync status badge after scripts initialise
        document.addEventListener('DOMContentLoaded', function () {
            const badge = document.getElementById('sync-status-badge');
            setTimeout(function () {
                if (typeof FirebaseSync !== 'undefined' && FirebaseSync.isReady) {
                    badge.className = 'sync-badge live';
                    badge.innerHTML = '<i class="bi bi-cloud-check-fill"></i> Cloud Sync Active — Cross-hospital data live';
                } else {
                    badge.className = 'sync-badge local';
                    badge.innerHTML = '<i class="bi bi-hdd-fill"></i> Local Mode — Configure Firebase for cross-hospital sync';
                }
            }, 2500);
        });
    </script>
</body>
</html>
