<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPRS | Hospital Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .preset-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
            color: rgba(255,255,255,0.85);
            font-size: 0.75rem;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            width: 100%;
        }
        .preset-btn:hover {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.4);
            color: #fff;
        }
        .preset-btn .role-badge {
            display: inline-block;
            font-size: 0.65rem;
            padding: 1px 6px;
            border-radius: 20px;
            margin-left: 4px;
            font-weight: 600;
        }
        .badge-admin   { background: rgba(234, 179, 8,  0.25); color: #fde68a; }
        .badge-doctor  { background: rgba(59,  130, 246, 0.25); color: #93c5fd; }
        .badge-recept  { background: rgba(16,  185, 129, 0.25); color: #6ee7b7; }
        .badge-nurse   { background: rgba(168, 85,  247, 0.25); color: #d8b4fe; }
        .sync-badge {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .sync-badge.live   { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.35); }
        .sync-badge.local  { background: rgba(245,158,11,0.2); color: #fcd34d; border: 1px solid rgba(245,158,11,0.35); }
        .sync-badge.check  { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }
        .preset-section-label {
            font-size: 0.68rem;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        /* Hospital Logo container above HPRS Network */
        #hospital-logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            min-height: 48px;
            transition: all 0.3s ease;
        }
        .hosp-logo-icon {
            width: 48px; height: 48px;
            border-radius: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .hosp-logo-icon.gch { background: linear-gradient(135deg, #1d4ed8, #0ea5e9); }
        .hosp-logo-icon.mch { background: linear-gradient(135deg, #047857, #14b8a6); }
        .hosp-logo-text { text-align: left; }
        .hosp-logo-text .hosp-name { font-size: 0.82rem; font-weight: 700; color: rgba(255,255,255,0.95); line-height: 1.1; }
        .hosp-logo-text .hosp-tag  { font-size: 0.67rem; color: rgba(255,255,255,0.45); }
        /* Hospital dropdown */
        #hospital-select {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 10px;
            font-size: 0.85rem;
            padding: 8px 12px;
        }
        #hospital-select option { background: #1e293b; color: white; }
        #hospital-select:focus { box-shadow: 0 0 0 3px rgba(37,99,235,0.35); border-color: #3b82f6; outline: none; }
    </style>
</head>
<body data-page="login">

    <div class="login-container">
        <div class="login-glass-card text-center">

            <!-- Dynamic Hospital Logo (above HPRS Network) -->
            <div id="hospital-logo-container">
                <div class="hosp-logo-icon gch" id="hospital-logo-icon">GCH</div>
                <div class="hosp-logo-text">
                    <div class="hosp-name" id="hospital-indicator-name">Global City Hospital</div>
                    <div class="hosp-tag">HPRS Partner Institution</div>
                </div>
            </div>

            <h3 class="brand-font text-white mb-1">HPRS Network</h3>
            <p class="text-white-50 small mb-2">Patient Record System &amp; Cross-Hospital Cloud Sync</p>

            <!-- Cloud Sync Status Badge -->
            <div class="mb-3">
                <span id="sync-status-badge" class="sync-badge check">
                    <i class="bi bi-arrow-repeat"></i> Checking cloud…
                </span>
            </div>

            <div id="login-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>

            <!-- Hospital Dropdown -->
            <div class="mb-3 text-start">
                <label class="form-label text-white-50 small"><i class="bi bi-building me-1"></i>Select Hospital</label>
                <select id="hospital-select" class="form-select" onchange="onHospitalChange(this.value)">
                    <option value="gch">🏥 Global City Hospital (GCH)</option>
                    <option value="mch">🏥 Municipal City Hospital (MCH)</option>
                </select>
            </div>

            <!-- GCH Quick-Select Presets -->
            <div id="presets-gch" class="mb-3 text-start">
                <div class="preset-section-label"><i class="bi bi-person-lines-fill me-1"></i>GCH — Quick Login</div>
                <div class="row g-1 mb-1">
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('gch.admin@hprs.com')">
                            <i class="bi bi-shield-check me-1"></i>GCH Admin
                            <span class="role-badge badge-admin">ADMIN</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('gch.dr.carter@hprs.com')">
                            <i class="bi bi-person-badge me-1"></i>Dr. Carter
                            <span class="role-badge badge-doctor">DR</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('gch.dr.sharma@hprs.com')">
                            <i class="bi bi-person-badge me-1"></i>Dr. Sharma
                            <span class="role-badge badge-doctor">DR</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('gch.nurse.sarah@hprs.com')">
                            <i class="bi bi-heart-pulse me-1"></i>Nurse Sarah
                            <span class="role-badge badge-nurse">RN</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('gch.nurse.david@hprs.com')">
                            <i class="bi bi-heart-pulse me-1"></i>Nurse David
                            <span class="role-badge badge-nurse">RN</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('gch.reception@hprs.com')">
                            <i class="bi bi-person-workspace me-1"></i>Reception
                            <span class="role-badge badge-recept">REC</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- MCH Quick-Select Presets (hidden by default) -->
            <div id="presets-mch" class="mb-3 text-start d-none">
                <div class="preset-section-label"><i class="bi bi-person-lines-fill me-1"></i>MCH — Quick Login</div>
                <div class="row g-1 mb-1">
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('mch.admin@hprs.com')">
                            <i class="bi bi-shield-check me-1"></i>MCH Admin
                            <span class="role-badge badge-admin">ADMIN</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('mch.dr.rivera@hprs.com')">
                            <i class="bi bi-person-badge me-1"></i>Dr. Rivera
                            <span class="role-badge badge-doctor">DR</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('mch.dr.patel@hprs.com')">
                            <i class="bi bi-person-badge me-1"></i>Dr. Patel
                            <span class="role-badge badge-doctor">DR</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('mch.nurse.priya@hprs.com')">
                            <i class="bi bi-heart-pulse me-1"></i>Nurse Priya
                            <span class="role-badge badge-nurse">RN</span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="preset-btn" onclick="setPreset('mch.reception@hprs.com')">
                            <i class="bi bi-person-workspace me-1"></i>Reception
                            <span class="role-badge badge-recept">REC</span>
                        </button>
                    </div>
                </div>
            </div>

            <hr style="border-color: rgba(255,255,255,0.12); margin: 0 0 16px 0;">

            <!-- Login Form -->
            <form id="login-form" class="text-start">
                <div class="mb-3">
                    <label class="form-label text-white-50 small">Username / Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control bg-transparent text-white border-secondary" placeholder="e.g. gch.dr.carter@hprs.com" value="gch.dr.carter@hprs.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-white-50 small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control bg-transparent text-white border-secondary" placeholder="••••••••" value="Password123!" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2.5">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Platform
                </button>
            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Firebase Compat SDK (required for cross-device sync) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/cloud-storage.js"></script>
    <script src="js/firebase-sync.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Fill login form with preset credentials
        function setPreset(email) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = 'Password123!';
            document.getElementById('email').focus();
        }

        // Hospital dropdown handler — swaps logo + presets
        function onHospitalChange(val) {
            const logoIcon = document.getElementById('hospital-logo-icon');
            const logoName = document.getElementById('hospital-indicator-name');
            const gchPresets = document.getElementById('presets-gch');
            const mchPresets = document.getElementById('presets-mch');

            if (val === 'mch') {
                logoIcon.className = 'hosp-logo-icon mch';
                logoIcon.textContent = 'MCH';
                logoName.textContent = 'Municipal City Hospital';
                gchPresets.classList.add('d-none');
                mchPresets.classList.remove('d-none');
                setPreset('mch.admin@hprs.com');
            } else {
                logoIcon.className = 'hosp-logo-icon gch';
                logoIcon.textContent = 'GCH';
                logoName.textContent = 'Global City Hospital';
                gchPresets.classList.remove('d-none');
                mchPresets.classList.add('d-none');
                setPreset('gch.dr.carter@hprs.com');
            }
        }

        // Show cloud sync status badge after scripts initialise
        document.addEventListener('DOMContentLoaded', function () {
            const badge = document.getElementById('sync-status-badge');
            setTimeout(function () {
                if (typeof FirebaseSync !== 'undefined' && FirebaseSync.isReady) {
                    badge.className = 'sync-badge live';
                    badge.innerHTML = '<i class="bi bi-cloud-check-fill"></i> Cloud Sync Active — Cross-hospital data live';
                } else {
                    badge.className = 'sync-badge local';
                    badge.innerHTML = '<i class="bi bi-hdd-fill"></i> Local Mode — Configure Firebase for cross-hospital sync';
                }
            }, 2500);
        });
    </script>
</body>
</html>
