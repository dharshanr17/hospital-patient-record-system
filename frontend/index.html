<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>HPRS | Hospital Network Login</title>

    <style>
        .sync-badge {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .sync-badge.live   { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.35); }
        .sync-badge.local  { background: rgba(245,158,11,0.2); color: #fcd34d; border: 1px solid rgba(245,158,11,0.35); }
        .sync-badge.check  { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }
        
        /* Hospital Logo container above HPRS Network */
        #hospital-logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
            min-height: 52px;
            transition: all 0.3s ease;
        }
        .hosp-logo-icon {
            width: 50px; height: 50px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .hosp-logo-text { text-align: left; }
        .hosp-logo-text .hosp-name { font-size: 0.9rem; font-weight: 700; color: rgba(255,255,255,0.95); line-height: 1.2; }
        .hosp-logo-text .hosp-tag  { font-size: 0.7rem; color: rgba(255,255,255,0.5); }
        
        /* Custom styled select boxes for dark glassmorphism card */
        .custom-dark-select {
            background-color: rgba(30, 41, 59, 0.95) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #f8fafc !important;
            border-radius: 10px !important;
            font-size: 0.88rem !important;
            padding: 9px 12px !important;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .custom-dark-select:focus {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25) !important;
        }
        .custom-dark-select option {
            background-color: #1e293b !important;
            color: #ffffff !important;
            padding: 8px 10px;
        }

            <!-- Dynamic Hospital Logo & Badge -->
            <div id="hospital-logo-container">

                <div class="hosp-logo-text">
                    <div class="hosp-name" id="hospital-indicator-name">Global City Hospital</div>
                    <div class="hosp-tag" id="hospital-indicator-tag">Tertiary Multispeciality Network Institution</div>
                </div>
            </div>

            <h3 class="brand-font text-white mb-1">HPRS Network</h3>
            <p class="text-white-50 small mb-2">Hospital Patient Record System &amp; Cloud Network Sync</p>

            <!-- Cloud Sync Status Badge -->
            <div class="mb-3">
                <span id="sync-status-badge" class="sync-badge check">
                    <i class="bi bi-arrow-repeat"></i> Checking cloud…
                </span>
            </div>

            <div id="login-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>

            <!-- 1. Hospital Dropdown (All 10 Network Hospitals) -->
            <div class="mb-3 text-start">
                <label class="form-label text-white-50 small fw-semibold">
                    <i class="bi bi-hospital me-1 text-primary"></i>Select Hospital (10 Network Hospitals)
                </label>
                <select id="hospital-select" class="form-select custom-dark-select" onchange="onHospitalChange(this.value)">
                    <option value="1">🏥 1. Global City Hospital (GCH)</option>
                    <option value="2">🏥 2. Municipal City Hospital (MCH)</option>
                    <option value="3">🏥 3. Sunrise Medical Center (SMC)</option>
                    <option value="4">🏥 4. Apollo Speciality Hospital (ASH)</option>
                    <option value="5">🏥 5. City Heart Institute (CHI)</option>
                    <option value="6">🏥 6. Greenview Community Hospital (GVCH)</option>
                    <option value="7">🏥 7. St. Thomas General Hospital (STGH)</option>
                    <option value="8">🏥 8. National Cancer Centre (NCC)</option>
                    <option value="9">🏥 9. LifeCare Maternity Hospital (LMH)</option>
                    <option value="10">🏥 10. Metro Spine &amp; Brain Hospital (MSBH)</option>
                </select>
            </div>

            <!-- 2. Staff Account Dropdown (Auto-fills Email & Password) -->
            <div class="mb-3 text-start">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label text-white-50 small fw-semibold mb-0">
                        <i class="bi bi-person-badge me-1 text-info"></i>Staff Account (Quick Auto-Fill)
                    </label>
                    <span class="badge bg-secondary-subtle text-white-50" style="font-size:0.65rem;">Auto-fills login</span>
                </div>
                <select id="staff-select" class="form-select custom-dark-select" onchange="onStaffSelect(this.value)">
                    <!-- Populated dynamically based on chosen hospital -->
                </select>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="text-start">
                <div class="mb-3">
                    <label class="form-label text-white-50 small">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control bg-transparent text-white border-secondary" placeholder="e.g. gch.admin@hprs.com" value="gch.admin@hprs.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-white-50 small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control bg-transparent text-white border-secondary" placeholder="••••••••" value="Password123!" required>
                    </div>
                    <div class="form-text text-white-50" style="font-size:0.72rem;">Default demo password for all accounts: <code>Password123!</code></div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2.5 fw-semibold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Platform
                </button>
                <div class="text-center mt-3">
                    <a href="#" class="text-white-50 small" onclick="alert('Demo password is Password123! across all hospital staff accounts.'); return false;">
                        <i class="bi bi-question-circle me-1"></i>Forgot Password?
                    </a>
                </div>
            </form>

        </div>
    </div>

        // When a user selects a hospital from the dropdown
        function onHospitalChange(hospId) {
            hospId = parseInt(hospId) || 1;
            const meta = hospitalMeta[hospId] || hospitalMeta[1];

            // 1. Update Logo & Branding
            const logoIcon = document.getElementById('hospital-logo-icon');
            const logoName = document.getElementById('hospital-indicator-name');
            const logoTag  = document.getElementById('hospital-indicator-tag');

            if (logoIcon) {
                logoIcon.textContent = meta.code;
                logoIcon.style.background = meta.grad;
            }
            if (logoName) logoName.textContent = meta.name;
            if (logoTag)  logoTag.textContent  = meta.tag;

            // 2. Populate Staff Account Dropdown
            const staffSelect = document.getElementById('staff-select');
            const staffList = hospitalStaff[hospId] || hospitalStaff[1];

            if (staffSelect) {
                staffSelect.innerHTML = staffList.map(s => 
                    `<option value="${s.email}">${s.label}</option>`
                ).join('');

                // Auto-fill first account (Administrator) by default
                if (staffList.length > 0) {
                    onStaffSelect(staffList[0].email);
                }
            }
        }

        // When a staff account is selected
        function onStaffSelect(email) {
            const emailInput = document.getElementById('email');
            const passInput  = document.getElementById('password');
            if (emailInput) emailInput.value = email;
            if (passInput)  passInput.value  = 'Password123!';
        }

        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', function () {
            onHospitalChange(1);

            const badge = document.getElementById('sync-status-badge');
            setTimeout(function () {
                if (typeof FirebaseSync !== 'undefined' && FirebaseSync.isReady) {
                    badge.className = 'sync-badge live';
                    badge.innerHTML = '<i class="bi bi-cloud-check-fill"></i> Cloud Sync Active — 10 Hospitals Live';
                } else {
                    badge.className = 'sync-badge local';
                    badge.innerHTML = '<i class="bi bi-hdd-fill"></i> Local Mode — 10 Hospitals Loaded';
                }
            }, 1500);
        });
