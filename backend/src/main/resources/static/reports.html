<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPRS - Reports & PDF Export</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reports">

    <div id="navbar-container"></div>

    <main class="container-fluid px-4 py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Medical Record Reports Generator</h2>
                <p class="text-muted small mb-0">Generate, print, and export official PDF patient summary reports.</p>
            </div>
        </div>

        <div class="card card-custom p-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-file-earmark-pdf text-danger me-2"></i>Select Patient for Medical Summary Export</h5>
            <div id="reports-patient-list">
                <div class="text-muted py-3"><div class="spinner-border spinner-border-sm text-primary me-2"></div> Loading directory...</div>
            </div>
        </div>

    </main>

    <footer>
        <div class="container-fluid px-4 text-center">
            Hospital Patient Record System (HPRS) &copy; 2026. Centralized Cloud Healthcare Platform.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cloud-storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
