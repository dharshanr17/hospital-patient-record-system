# Spring Boot Server Config
server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration (Externalized to Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hprsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Script Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# H2 Console (For development & testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:SuperSecretHospitalPatientRecordSystemJWTKey32BytesMinimum!}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}
